name: Feature Request
description: Suggest a new capability, or an improvement to how the export command works today.
title: "[FEATURE]: "
labels: ["enhancement"]
assignees: []

body:
  - type: input
    id: summary
    attributes:
      label: 📌 Summary
      description: "Short summary of the request. This appears in the issue list preview."
      placeholder: "Support exporting a non-default database connection via a --connection option."
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: 🧩 Type of Request
      description: "Is this something new, or a change to existing behavior?"
      options:
        - New capability
        - Improvement to existing behavior
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: ❓ Problem / Use Case
      description: "What are you trying to do, and what makes it difficult today?"
      placeholder: "We run multi-tenant apps and need to back up a connection other than database.default."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 💡 Proposed Solution
      description: "Describe the behavior you would like. A sample command or config snippet helps."
      placeholder: "php artisan db:export --connection=tenant_a"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: "Any workarounds you are using, or other approaches you weighed?"
      placeholder: "Currently we swap config('database.default') at runtime before calling the command."
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 🤝 Contribution
      options:
        - label: "I am willing to open a pull request for this."
          required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 💬 Additional Context
      description: "Any other details or references?"
      placeholder: "Add additional context"
    validations:
      required: false
