name: Question / Help
description: Ask about usage, configuration, or something the README does not cover.
title: "[QUESTION]: "
labels: ["question"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ⚠️ Please redact passwords and hostnames from anything you paste here.

  - type: input
    id: summary
    attributes:
      label: 📌 Summary
      description: "Short summary of your question. This appears in the issue list preview."
      placeholder: "How do I write exports to an S3 disk instead of local storage?"
    validations:
      required: true

  - type: textarea
    id: question_details
    attributes:
      label: ❓ Details
      description: "What are you trying to do, and where are you stuck?"
      placeholder: "I set BACKUP_DISK=s3 but the zip still lands in storage/app."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 🛠️ What have you tried?
      description: "Config you have set, docs you have read, and anything you have already ruled out."
      placeholder: "Read the Configuration section of the README, published the config, cleared the config cache."
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: 🔢 Versions
      description: "Package, Laravel, and PHP versions, if relevant."
      placeholder: "tomshaw/laravel-database-export 0.6.0, Laravel 13.2, PHP 8.5.2"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 💬 Additional Context
      description: "Any other information, config, or output — credentials redacted."
      placeholder: "Add additional context"
    validations:
      required: false
